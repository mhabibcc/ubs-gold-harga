name: Update harga UBS

on:
  schedule:
    # Senin–Jumat 10:17 dan 13:17 WIB (cron GitHub memakai UTC)
    - cron: "17 3,6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-harga
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil harga
        run: python scraper/scrape.py

      - name: Commit bila ada perubahan
        run: |
          if git diff --quiet -- data; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: harga UBS $(TZ=Asia/Jakarta date +%F)"
          git push
